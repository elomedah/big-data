name: Accès SSH au cluster
description: Demander un accès ou remplacer vos clés publiques SSH. Mettez votre nom.prenom dans le titre du ticket.
title: "[Accès SSH] Demande étudiant"
body:
  - type: markdown
    attributes:
      value: |
        Formulaire ouvert à tous les utilisateurs GitHub, sans inscription préalable.
        Choisissez un identifiant nom.prenom. L'enseignant valide la demande avant activation.
        Collez uniquement des clés publiques .pub, jamais de clé privée.
        Le contenu de cette demande est visible par les lecteurs du dépôt.
  - type: input
    id: school
    attributes:
      label: École
      description: Saisissez le nom de votre école tel qu'indiqué par votre enseignant.
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: Username (nom.prenom)
      description: Nom puis prénom, en minuscules sans accents ni espaces, séparés par un point (32 caractères maximum). Les tirets sont acceptés dans les noms composés.
      placeholder: dupont.jean-pierre
    validations:
      required: true
  - type: textarea
    id: keys
    attributes:
      label: Clés publiques SSH
      description: Une clé ssh-ed25519 par ligne, dix clés distinctes maximum. Les doublons sont acceptés et dédupliqués. Cette liste remplace les clés existantes de ce compte ; incluez toutes les clés à conserver.
      render: text
    validations:
      required: true
