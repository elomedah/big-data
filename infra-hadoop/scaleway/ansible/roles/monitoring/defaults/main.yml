---
monitoring_scrape_interval: 30s
monitoring_retention_time: 7d
monitoring_retention_size: 2GB
monitoring_grafana_port: 3000
monitoring_prometheus_port: 9090
monitoring_blackbox_port: 9115
monitoring_hadoop_port: 9116
# Add extra TCP endpoints as {target: "10.0.0.10:1234", service: "my-service"}.
monitoring_extra_tcp_targets: []
# Optional existing Alertmanager URLs, for example ["10.0.0.20:9093"].
monitoring_alertmanager_targets: []
